<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>HIIT Workout</title>
<meta name="description" content="Retro-future HIIT circuit trainer with voice coaching." />
<meta name="theme-color" content="#0a0e1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HIIT" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="topbar">
      <button class="icon-btn" id="btn-history" aria-label="History">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 3v0l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 7v5l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="chrome-title">HIIT</h1>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.3 2.4a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1L11 21h4l.3-2.4a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="subtitle">Choose your circuit</p>
    <div class="category-grid" id="category-grid"></div>
    <div class="horizon"></div>
  </section>

  <!-- CATEGORY / DIFFICULTY / DURATION -->
  <section id="screen-category" class="screen">
    <div class="topbar">
      <button class="icon-btn back-btn" data-back="screen-home" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="category-title" class="chrome-title small"></h2>
      <span class="icon-btn spacer"></span>
    </div>
    <div id="difficulty-tabs" class="tabs"></div>
    <div id="duration-row" class="duration-row"></div>
    <div id="circuit-summary" class="circuit-summary"></div>
    <div id="circuit-list" class="circuit-list"></div>
    <button id="btn-go-preworkout" class="btn-primary sticky-cta">Continue</button>
    <div class="horizon"></div>
  </section>

  <!-- PRE-WORKOUT -->
  <section id="screen-preworkout" class="screen">
    <div class="topbar">
      <button class="icon-btn back-btn" data-back="screen-category" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="chrome-title small">Circuit Overview</h2>
      <span class="icon-btn spacer"></span>
    </div>
    <div id="preworkout-meta" class="preworkout-meta"></div>
    <div id="preworkout-list" class="circuit-list"></div>
    <button id="btn-start-workout" class="btn-primary sticky-cta btn-start">START WORKOUT</button>
    <div class="horizon"></div>
  </section>

  <!-- WORKOUT (also used for stretch phases) -->
  <section id="screen-workout" class="screen">
    <div class="workout-progress-wrap">
      <div class="progress-label" id="progress-label"></div>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
    </div>

    <div class="phase-label" id="phase-label">GET READY</div>
    <div class="phase-timer" id="phase-timer">0:30</div>

    <div class="exercise-stage">
      <div class="exercise-block" id="exercise-current">
        <div class="exercise-name" id="exercise-current-name"></div>
        <div class="illustration-wrap" id="exercise-current-ill"></div>
      </div>
      <div class="exercise-block next-block" id="exercise-next" hidden>
        <div class="next-label">NEXT</div>
        <div class="exercise-name" id="exercise-next-name"></div>
        <div class="illustration-wrap" id="exercise-next-ill"></div>
      </div>
    </div>

    <div class="workout-controls">
      <button id="btn-pause" class="btn-secondary">Pause</button>
      <button id="btn-end" class="btn-danger">End Workout</button>
    </div>
    <div class="horizon"></div>
  </section>

  <!-- SUMMARY -->
  <section id="screen-summary" class="screen">
    <div class="summary-wrap">
      <h2 class="chrome-title">Complete</h2>
      <div id="summary-body" class="summary-body"></div>
      <button id="btn-summary-done" class="btn-primary">Done</button>
    </div>
    <div class="horizon"></div>
  </section>

  <!-- HISTORY -->
  <section id="screen-history" class="screen">
    <div class="topbar">
      <button class="icon-btn back-btn" data-back="screen-home" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="chrome-title small">History</h2>
      <span class="icon-btn spacer"></span>
    </div>
    <div id="history-stats" class="history-stats"></div>
    <div id="history-list" class="history-list"></div>
    <button id="btn-clear-history" class="btn-danger-ghost">Clear History</button>
    <div class="horizon"></div>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen">
    <div class="topbar">
      <button class="icon-btn back-btn" data-back="screen-home" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="chrome-title small">Settings</h2>
      <span class="icon-btn spacer"></span>
    </div>
    <div class="settings-block">
      <label for="volume-slider">Voice Volume</label>
      <input type="range" id="volume-slider" min="0.5" max="1" step="0.05" />
      <div class="settings-row">
        <span id="volume-value"></span>
        <button id="btn-voice-test" class="btn-secondary small-btn">Test Voice</button>
      </div>
    </div>
    <div class="horizon"></div>
  </section>

</div>

<!-- Confirm modal -->
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-secondary">Cancel</button>
      <button id="confirm-ok" class="btn-danger">Confirm</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/audioClips.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/history.js"></script>
<script src="js/app.js"></script>
</body>
</html>
